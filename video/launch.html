* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body { position: relative; font-family: var(--font-display); font-weight: 600; color: var(--color-ink); letter-spacing: var(--tracking-display); background: var(--grain), var(--fibre), var(--color-paper); }
body * { position: absolute; animation-duration: var(--T); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); animation-fill-mode: both; animation-play-state: paused; }
img { display: block; }
.paper { filter: var(--shadow-paper); }

.icon { left: 810px; top: 250px; width: 300px; height: 300px; animation-name: icon; }
.name { left: 0; top: 570px; width: 1920px; text-align: center; font-size: 190px; line-height: 1; animation-name: name; }
.tag { left: 0; top: 790px; width: 1920px; text-align: center; font-size: 56px; font-weight: 500; letter-spacing: 0; color: var(--color-ink-2); animation-name: tag; }
@keyframes icon { 0% { opacity: 0; scale: 0.5; } 3% { opacity: 1; scale: 1.08; } 5% { scale: 1; } 13% { opacity: 1; translate: 0 0; } 15%, 100% { opacity: 0; translate: 0 -30px; } }
@keyframes name { 0%, 2.5% { opacity: 0; translate: 0 40px; } 6% { opacity: 1; translate: 0 0; } 13% { opacity: 1; translate: 0 0; } 15%, 100% { opacity: 0; translate: 0 -30px; } }
@keyframes tag { 0%, 5.5% { opacity: 0; translate: 0 30px; } 9% { opacity: 1; translate: 0 0; } 13% { opacity: 1; } 15%, 100% { opacity: 0; } }

.bar { left: 0; top: 0; width: 1920px; height: 112px; animation-name: bar; }
.bar::before { content: ""; position: absolute; inset: 0 0 -8px 0; background: var(--grain), var(--color-ink); clip-path: var(--tear-bottom); }
.bar .clock { right: 70px; top: 38px; color: var(--color-paper); font-size: 30px; font-weight: 500; letter-spacing: 0; }
.bar img { left: 1298px; top: 14px; width: 84px; height: 84px; }
@keyframes bar { 0%, 14% { translate: 0 -120px; } 17.5%, 84% { translate: 0 0; } 87%, 100% { translate: 0 -120px; } }
.f-idle { animation-name: fidle; } .f-hungry { animation-name: fhungry; } .f-busy { animation-name: fbusy; } .f-happy { animation-name: fhappy; }
@keyframes fidle { 0%, 25% { opacity: 1; } 25.5%, 33% { opacity: 0; } 33.5%, 57% { opacity: 1; } 57.5%, 100% { opacity: 0; } }
@keyframes fhungry { 0%, 25% { opacity: 0; scale: 1; } 25.5% { opacity: 1; scale: 1.25; } 28%, 33% { opacity: 1; scale: 1.12; } 33.5%, 100% { opacity: 0; scale: 1; } }
@keyframes fbusy { 0%, 57% { opacity: 0; } 57.5%, 67% { opacity: 1; } 67.5%, 100% { opacity: 0; } }
@keyframes fhappy { 0%, 67% { opacity: 0; scale: 1; } 67.5% { opacity: 1; scale: 1.3; } 70%, 100% { opacity: 1; scale: 1; } }

.cap { left: 150px; top: 380px; width: 720px; font-size: 118px; line-height: 1.02; }
.cap small { position: static; display: block; margin-top: 36px; font-size: 44px; font-weight: 500; letter-spacing: 0; line-height: 1.3; color: var(--color-ink-2); }
.c1 { animation-name: c1; } .c2 { animation-name: c2; } .c3 { animation-name: c3; } .c4 { animation-name: c4; }
@keyframes c1 { 0%, 16% { opacity: 0; translate: 0 40px; } 19.5%, 34% { opacity: 1; translate: 0 0; } 36%, 100% { opacity: 0; translate: 0 -30px; } }
@keyframes c2 { 0%, 36.5% { opacity: 0; translate: 0 40px; } 40%, 55.5% { opacity: 1; translate: 0 0; } 57%, 100% { opacity: 0; translate: 0 -30px; } }
@keyframes c3 { 0%, 57% { opacity: 0; translate: 0 40px; } 60%, 66% { opacity: 1; translate: 0 0; } 67.5%, 100% { opacity: 0; translate: 0 -30px; } }
@keyframes c4 { 0%, 67.5% { opacity: 0; translate: 0 40px; } 71%, 83.5% { opacity: 1; translate: 0 0; } 85.5%, 100% { opacity: 0; translate: 0 -30px; } }

.file { left: 900px; top: 830px; width: 430px; padding: 26px 30px; border-radius: 22px; font-size: 40px; line-height: 1.1; letter-spacing: -0.01em; background: var(--grain), var(--fibre), var(--color-card); box-shadow: inset 0 0 0 1px var(--color-rule), 0 7px 0 0 var(--color-edge); animation-name: file; }
.file small { position: static; display: block; margin-top: 8px; font-size: 28px; font-weight: 500; letter-spacing: 0; color: var(--color-muted); }
@keyframes file { 0%, 17% { opacity: 0; translate: 0 60px; rotate: -6deg; scale: 1; } 20% { opacity: 1; translate: 0 0; rotate: -6deg; scale: 1; animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); } 29% { opacity: 1; translate: 225px -640px; rotate: 5deg; scale: 0.8; } 31.5% { opacity: 1; translate: 225px -660px; rotate: 3deg; scale: 0.78; animation-timing-function: cubic-bezier(0.7, 0, 0.84, 0); } 33.5%, 100% { opacity: 0; translate: 225px -800px; rotate: 0deg; scale: 0.12; } }

.mat { left: 1010px; top: 150px; width: 680px; height: 800px; rotate: -2deg; animation-name: mat; }
.mat i { inset: 0; background: var(--grain), var(--fibre), var(--color-sugar); clip-path: var(--tear-sheet); }
@keyframes mat { 0%, 33% { opacity: 0; scale: 0.94; } 37%, 84% { opacity: 1; scale: 1; } 86%, 100% { opacity: 0; scale: 0.96; } }
.pop { left: 1060px; top: 190px; width: 560px; transform-origin: 50% 0; }
.p-photo { animation-name: pphoto; } .p-work { top: 330px; animation-name: pwork; } .p-done { top: 260px; animation-name: pdone; }
@keyframes pphoto { 0%, 34% { opacity: 0; scale: 0.9; translate: 0 -30px; } 37.5%, 56.5% { opacity: 1; scale: 1; translate: 0 0; } 57.5%, 100% { opacity: 0; scale: 0.97; } }
@keyframes pwork { 0%, 57% { opacity: 0; scale: 0.97; } 58.5%, 66.5% { opacity: 1; scale: 1; } 67.5%, 100% { opacity: 0; scale: 0.97; } }
@keyframes pdone { 0%, 67% { opacity: 0; scale: 0.95; } 69.5%, 84% { opacity: 1; scale: 1; } 86%, 100% { opacity: 0; scale: 0.97; } }

.cursor { left: 1322px; top: 494px; width: 44px; height: 44px; border-radius: 50%; background: color-mix(in oklab, var(--color-accent) 80%, transparent); box-shadow: 0 0 0 4px var(--color-ink); animation-name: cursor; }
@keyframes cursor { 0%, 42% { opacity: 0; translate: 330px 420px; scale: 1; } 44% { opacity: 1; translate: 330px 420px; scale: 1; animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); } 51% { opacity: 1; translate: 0 0; scale: 1; } 52.5% { translate: 0 0; scale: 0.7; } 54.5% { opacity: 1; translate: 0 0; scale: 1; } 56.5%, 100% { opacity: 0; translate: 0 0; scale: 1; } }

.sticker { left: 1540px; top: 170px; width: 230px; height: 230px; border-radius: 50%; display: grid; place-items: center; text-align: center; font-size: 46px; line-height: 1.02; background: var(--grain), var(--fibre), var(--color-accent-3); animation-name: sticker; }
@keyframes sticker { 0%, 71% { opacity: 0; scale: 0.3; rotate: -20deg; } 73.5% { opacity: 1; scale: 1.12; rotate: 11deg; } 75%, 84% { opacity: 1; scale: 1; rotate: 9deg; } 86%, 100% { opacity: 0; scale: 0.9; rotate: 9deg; } }

.outro { left: 0; top: 0; width: 1920px; height: 1080px; color: var(--color-paper); animation-name: outro; }
.outro::before { content: ""; position: absolute; inset: -12px 0 0 0; background: var(--grain), var(--color-ink); clip-path: var(--tear-both); }
.outro h2 { left: 150px; top: 230px; width: 1100px; font-size: 136px; line-height: 1; }
.outro p { left: 150px; top: 540px; font-size: 48px; font-weight: 500; letter-spacing: 0; color: color-mix(in oklab, var(--color-paper) 80%, var(--color-ink)); }
.outro .dl { left: 150px; top: 670px; padding: 30px 48px; border-radius: 24px; font-size: 44px; letter-spacing: -0.01em; color: var(--color-ink); background: var(--grain), var(--fibre), var(--color-accent); box-shadow: 0 9px 0 0 var(--color-accent-deep); }
.outro img { left: 1330px; top: 330px; width: 420px; height: 420px; rotate: 6deg; }
@keyframes outro { 0%, 85% { translate: 0 1100px; } 89%, 97.5% { translate: 0 0; opacity: 1; } 100% { translate: 0 0; opacity: 0; } }
</style>
</head>
<body>
<img class="icon" src="../site/images/icon-512.png" alt="">
<div class="name">Morph</div>
<div class="tag">Feed it a file.</div>

<div class="mat paper"><i></i></div>
<img class="pop p-photo paper" src="../site/images/app/photo.png" alt="">
<img class="pop p-work paper" src="../site/images/app/working.png" alt="">
<img class="pop p-done paper" src="../site/images/app/done.png" alt="">
<div class="cursor"></div>
<div class="sticker paper">89%<br>lighter</div>

<div class="cap c1">Drop a file on its face.</div>
<div class="cap c2">Pick a button.<small>Photos, PDFs and videos.</small></div>
<div class="cap c3">Morphing…</div>
<div class="cap c4">3.9 MB in,<br>424 KB out.<small>Saved beside the original.</small></div>

<div class="bar paper">
  <span class="clock">Tue 9:41</span>
  <img class="f-idle" src="face-white-idle.png" alt="">
  <img class="f-hungry" src="face-white-hungry.png" alt="">
  <img class="f-busy" src="face-white-busy.png" alt="">
  <img class="f-happy" src="face-white-happy.png" alt="">
</div>
<div class="file">Beach day.heic<small>3.9 MB</small></div>

<div class="outro">
  <h2>Nothing leaves your Mac.</h2>
  <p>No account. No upload.</p>
  <div class="dl">Download Morph for Mac</div>
  <img src="../site/images/icon-512.png" alt="">
</div>
<script>
window.seek = (ms) => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = ms; });
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]);
</script>
</body>
</html>
